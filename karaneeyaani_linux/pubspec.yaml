name: karaneeyaani_linux
description: "Karaneeyaani - Linux Desktop Edition with full features."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  intl: ^0.20.2
  uuid: ^4.5.1
  crypto: ^3.0.6
  shared_preferences: ^2.5.5
  flutter_animate: ^4.5.2
  audioplayers: ^6.1.0
  rxdart: ^0.28.0
  http: ^1.3.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/alarm.wav
    - assets/icon.png
