name: Build Windows Desktop Installer

on:
  push:
    branches: [ main ]
    paths:
      - 'karaneeyaani_windows/**'
      - '.github/workflows/build_windows_exe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Package Windows Installer (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop Support
        run: flutter config --enable-windows-desktop

      - name: Install Inno Setup Compiler
        run: choco install innosetup -y --no-progress

      - name: Install Flutter Dependencies
        working-directory: karaneeyaani_windows
        run: flutter pub get

      - name: Build Flutter Windows Desktop (Release)
        working-directory: karaneeyaani_windows
        run: flutter build windows --release

      - name: Compile Windows Installer (.exe)
        working-directory: karaneeyaani_windows
        run: |
          $isccPath = "C:\Program Files (x86)\Inno Setup 6\iscc.exe"
          if (Test-Path $isccPath) {
            & $isccPath "windows\installer\karaneeyaani_installer.iss"
          } else {
            iscc "windows\installer\karaneeyaani_installer.iss"
          }

      - name: Create Portable Zip Package
        run: |
          Compress-Archive -Path "karaneeyaani_windows\build\windows\x64\runner\Release\*" -DestinationPath "karaneeyaani_windows\build\installer\Karaneeyaani-Windows-Portable.zip" -Force

      - name: Upload Setup Installer (.exe) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Karaneeyaani-Setup-Installer
          path: karaneeyaani_windows/build/installer/Karaneeyaani-Setup.exe
          if-no-files-found: error

      - name: Upload Portable Standalone Release Bundle
        uses: actions/upload-artifact@v4
        with:
          name: Karaneeyaani-Windows-Portable
          path: karaneeyaani_windows/build/installer/Karaneeyaani-Windows-Portable.zip
          if-no-files-found: error

      - name: Publish to GitHub Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-windows
          name: "Karaneeyaani Windows Desktop Edition v1.0.0"
          body: |
            ## Karaneeyaani - Windows Desktop Edition

            ### Download & Installation
            - **Setup Installer (`.exe`)**: Download **`Karaneeyaani-Setup.exe`** to install on Windows (with desktop shortcut and Start menu entry).
            - **Portable Release (`.zip`)**: Download **`Karaneeyaani-Windows-Portable.zip`** to run without installation.
          files: |
            karaneeyaani_windows/build/installer/Karaneeyaani-Setup.exe
            karaneeyaani_windows/build/installer/Karaneeyaani-Windows-Portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
